
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-status-app
  labels:
    app: devops-status-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-status-app
  template:
    metadata:
      labels:
        app: devops-status-app
    spec:
      containers:
        - name: devops-status-app
          image: devops-status-app:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "1.0.0"

          # Check whether the application is ready for traffic
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          # Restart the container if the application becomes unhealthy
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20

          # Container resource management
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"

